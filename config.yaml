# Okta Device Posture Provider Configuration

server:
  host: 0.0.0.0
  port: 8443
  debug: true

saml:
  # Your IdP Entity ID
  entity_id: https://dpp.example.com

  # SSO endpoint URL
  sso_url: https://dpp.example.com/saml/sso

  # Assertion Consumer Service URL (not used for IdP-initiated)
  acs_url: https://dpp.example.com/saml/acs

  # Certificate files for SAML signing
  cert_file: certs/saml.crt
  key_file: certs/saml.key

  # NameID format
  name_id_format: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress

  # Assertion validity in hours
  valid_hours: 1

okta:
  # Okta Device Posture namespace
  namespace: urn:okta:saml:2.0:DevicePosture

  # Your Okta Entity ID (replace with your actual Okta org)
  entity_id: http://www.okta.com/exk1234567890abcdef

  # Okta ACS URL (replace with your actual app ACS URL)
  acs_url: https://your-org.okta.com/sso/saml2/0oa1234567890abcdef

device_checks:
  # Require device to be managed (enrolled in MDM)
  require_managed: true

  # Require device to be compliant with policies
  require_compliant: false

  # Require device storage encryption
  require_encrypted: false

  # Allowed operating systems
  allowed_os:
    - Windows
    - macOS
    - iOS
    - Android
    - Linux

  # Minimum OS versions (optional)
  min_os_versions:
    Windows: "10.0"
    macOS: "12.0"
    iOS: "15.0"
    Android: "11.0"
