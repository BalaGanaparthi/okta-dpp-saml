version: '3.8'

services:
  dpp:
    build: .
    container_name: okta-dpp
    ports:
      - "8443:8443"
    volumes:
      # Mount config for easy updates
      - ./config.yaml:/app/config.yaml
      # Persist certificates
      - ./certs:/app/certs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8443/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

